stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: ""

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - pytest -q

build:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY/flowlab/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY/flowlab/$CI_PROJECT_NAME:latest" .
    - docker push "$CI_REGISTRY/flowlab/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY/flowlab/$CI_PROJECT_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 192.168.4.111 >> ~/.ssh/known_hosts
  script:
    - ssh root@192.168.4.111 "echo '$CI_REGISTRY_PASSWORD' | docker login '$CI_REGISTRY' -u '$CI_REGISTRY_USER' --password-stdin && cd /root/work && docker compose -f docker-compose.test.yml pull '$CI_PROJECT_NAME' && docker compose -f docker-compose.test.yml up -d --no-build '$CI_PROJECT_NAME'"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
